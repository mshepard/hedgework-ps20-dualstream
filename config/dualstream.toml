# DualStream configuration (Phase 1)
#
# Phase 2 will add [battery], [schedule], and an expanded [power] section.
# Those blocks are intentionally absent for now so the surface stays minimal.

[server]
host = "0.0.0.0"
port = 8080
# Admin bearer token. Required on the Authorization header for the dual-tile
# diagnostic UI at /, the /api/status, /api/snapshot, /api/snapshots, and
# /api/offer endpoints. Change this for any non-bench deployment. Tailscale
# ACLs remain the primary access control; the token is defense-in-depth.
auth_token = "change-me"
# Public viewer token. The per-camera viewer pages at /cam0 and /cam1 only
# work when the caller presents this token, either as a "?key=<token>" query
# parameter (the shareable form) or as a Bearer header. Empty disables the
# public pages entirely. The installer auto-generates a random value on
# first install. The admin auth_token above is also accepted on the public
# pages, so an admin can preview them without copying the viewer key.
viewer_token = "change-me-viewer"
# Brand / site label shown on the public per-camera pages and in browser
# tabs. Empty falls back to "DualStream". Matches the umbrella project
# brand at https://ps20.hedgework.net/.
site_name = "HEDGEWORK @ PS 20"

[camera0]
resolution = [1280, 720]
framerate = 15
bitrate_kbps = 1000
# IMX708 sensor controls passed through to picamera2. Keep empty unless tuning.
controls = {}
# Optional human-friendly label shown on the public /cam0 page. Empty falls
# back to "Camera 0".
name = ""

[camera1]
resolution = [1280, 720]
framerate = 15
bitrate_kbps = 1000
controls = {}
name = ""

[snapshots]
enabled = true
# Idle capture cadence: used when no public viewer is polling the cam
# page. Keep this long — these snapshots also drive the on-disk
# retention pipeline.
interval_seconds = 300
# Active capture cadence: used while a public viewer has the cam page
# open and is polling /api/public/snapshots/latest. This is what makes
# the per-camera page feel "live-ish" over LTE / Funnel where WebRTC
# media doesn't survive. Each poll bumps the worker to this rate; it
# falls back to interval_seconds after active_window_seconds of no polls.
active_interval_seconds = 1.5
active_window_seconds   = 15.0
retention_days = 7
path = "/var/lib/dualstream/snapshots"
# JPEG quality 1-95. Higher = bigger file. 75 is a reasonable balance.
jpeg_quality = 75

[power]
# Phase 1 honours only these two minimal settings. Phase 2 expands this block.
disable_act_led = true
idle_grace_seconds = 10
