<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEDGEWORK @ PS 20 · Admin</title>
    <link rel="icon" type="image/png" href="/static/media/Hedge-icon.png" />
    <link rel="apple-touch-icon" href="/static/media/Hedge-icon.png" />
    <!-- Inter (UI / body) + Lexend Tera (brand mark) — same loadout as the
         public cam page so both surfaces share typography. Falls back to a
         system sans when fonts.googleapis.com is unreachable. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend+Tera:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <div class="brand">
        <span id="brand-name" class="brand-name">HEDGEWORK @ PS 20</span>
        <span class="brand-sep">·</span>
        <span class="brand-role">Admin</span>
      </div>
      <div class="status-group">
        <span id="mode-badge" class="mode-badge mode-unknown" title="Power mode">--</span>
        <span id="viewer-count" class="counter" title="Active viewers">0 viewers</span>
      </div>
      <div class="controls">
        <input
          id="token-input"
          type="password"
          placeholder="Bearer token"
          autocomplete="off"
          spellcheck="false"
        />
        <button id="start-btn" type="button">Start</button>
        <button id="stop-btn" type="button" disabled>Stop</button>
        <button id="snapshot-btn" type="button">Snapshot</button>
      </div>
    </header>

    <main>
      <section class="grid">
        <figure class="tile">
          <video id="video-0" autoplay playsinline muted></video>
          <figcaption>
            <span class="tile-label">
              <span id="cam0-name">Camera 0</span>
              <a id="cam0-share" class="tile-share disabled" href="#" target="_blank" rel="noopener" title="Open single-camera view in a new tab">↗ single view</a>
            </span>
            <span id="cam0-meta" class="meta">--</span>
          </figcaption>
        </figure>
        <figure class="tile">
          <video id="video-1" autoplay playsinline muted></video>
          <figcaption>
            <span class="tile-label">
              <span id="cam1-name">Camera 1</span>
              <a id="cam1-share" class="tile-share disabled" href="#" target="_blank" rel="noopener" title="Open single-camera view in a new tab">↗ single view</a>
            </span>
            <span id="cam1-meta" class="meta">--</span>
          </figcaption>
        </figure>
      </section>

      <section class="snapshots">
        <h2>Recent snapshots</h2>
        <div id="snapshot-strip" class="snapshot-strip">
          <span class="empty">No snapshots yet.</span>
        </div>
      </section>

      <section id="log" class="log" aria-live="polite"></section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
