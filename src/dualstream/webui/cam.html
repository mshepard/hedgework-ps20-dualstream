<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HEDGEWORK @ PS 20 · Camera</title>
    <link rel="icon" type="image/png" href="/static/media/Hedge-icon.png" />
    <link rel="apple-touch-icon" href="/static/media/Hedge-icon.png" />
    <!-- Inter is the brand typeface used on https://ps20.hedgework.net/
         for body / UI text; Lexend Tera is reserved for the HEDGEWORK @ PS 20
         brand mark in the header. If the browser can't reach
         fonts.googleapis.com (e.g. an air-gapped tailnet), the CSS falls
         back to Inter, then a system sans-serif, so the page still renders. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend+Tera:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="cam-page">
    <header class="cam-topbar">
      <div class="brand">
        <span id="brand-name" class="brand-name">HEDGEWORK @ PS 20</span>
        <span class="brand-sep">·</span>
        <span id="cam-label">Camera ?</span>
        <span id="snapshot-meta" class="snapshot-meta"></span>
      </div>
      <div class="controls">
        <!-- Start kicks the snapshot worker into fast cadence (~1.5 s) and
             starts polling for fresh frames; Stop returns to the slow
             idle cadence (every few minutes) so the page still shows
             *something* current but doesn't keep the Pi capturing. -->
        <button id="start-btn" type="button">Start</button>
        <button id="stop-btn" type="button" disabled>Stop</button>
        <button id="fullscreen-btn" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </header>

    <main class="cam-main">
      <div class="cam-stage" id="cam-stage">
        <!-- Snapshot streaming: cam.js swaps this <img>'s src on each
             poll. We deliberately use <img> rather than <video> + poster
             so we can swap frames cheaply (the browser caches and
             diff-renders) and so the same UX works through any HTTPS
             transport — Tailscale Funnel, an LTE carrier that blocks
             sustained UDP, etc. -->
        <img
          id="frame"
          alt="Latest camera frame"
          decoding="async"
          referrerpolicy="no-referrer"
        />
        <div id="live-indicator" class="cam-live-indicator hidden" aria-hidden="true">
          <span class="cam-live-dot"></span>
          <span>LIVE</span>
        </div>
        <div id="overlay" class="cam-overlay">
          <div class="cam-overlay-inner" id="overlay-message">Loading…</div>
        </div>
      </div>
    </main>

    <script src="/static/cam.js"></script>
  </body>
</html>
