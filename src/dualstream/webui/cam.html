<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hedgework @ PS 20 · Camera</title>
    <!-- Inter is the brand typeface used on https://ps20.hedgework.net/.
         If the browser can't reach fonts.googleapis.com the CSS falls
         back to a system sans-serif so the page still renders cleanly
         (e.g. if Tailscale is the only network and the host has no
         internet egress). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body class="cam-page">
    <header class="cam-topbar">
      <div class="brand">
        <span id="brand-name" class="brand-name">Hedgework @ PS 20</span>
        <span class="brand-sep">·</span>
        <span id="cam-label">Camera ?</span>
        <span id="snapshot-meta" class="snapshot-meta"></span>
      </div>
      <div class="controls">
        <button id="start-btn" type="button">Start</button>
        <button id="stop-btn" type="button" disabled>Stop</button>
        <button id="fullscreen-btn" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">⛶</button>
      </div>
    </header>

    <main class="cam-main">
      <div class="cam-stage" id="cam-stage">
        <video id="video" autoplay playsinline muted></video>
        <div id="overlay" class="cam-overlay">
          <div class="cam-overlay-inner" id="overlay-message">Loading…</div>
        </div>
      </div>
    </main>

    <script src="/static/cam.js"></script>
  </body>
</html>
